name: Security image inventory
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 5 * * 1'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLCipher OpenSSL development dependency
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Check production entrypoint
        working-directory: .
        run: CGO_ENABLED=1 CGO_CFLAGS=-DSQLITE_ENABLE_FTS5 CGO_LDFLAGS=-lm govulncheck -tags=fts5 ./cmd/server
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: ['.']
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current bases and record exact image
        run: |
          docker build --pull --no-cache -t security-image:scan "${{ matrix.context }}"
          docker image inspect security-image:scan > image-metadata.json
      - name: Verify distrusted emSign G3 root is absent
        run: |
          set -euo pipefail
          cid=$(docker create security-image:scan)
          trap 'docker rm "$cid" > /dev/null' EXIT
          docker cp "$cid:/etc/ssl/certs/ca-certificates.crt" ca-bundle.crt
          openssl crl2pkcs7 -nocrl -certfile ca-bundle.crt | openssl pkcs7 -print_certs -noout > ca-subjects.txt
          if grep -Fi 'emSign ECC Root CA - G3' ca-subjects.txt; then
            echo 'Compromised emSign G3 remains trusted' >&2
            exit 1
          fi
      - name: Scan complete image inventory
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.1
          image-ref: security-image:scan
          format: json
          output: vulnerabilities.json
          exit-code: '0'
      - name: Generate exact image SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.1
          image-ref: security-image:scan
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-${{ strategy.job-index }}
          path: |
            image-metadata.json
            vulnerabilities.json
            sbom.cdx.json
            ca-subjects.txt
      - name: Fail on fixable high or critical image vulnerabilities
        run: |
          python3 - <<'PYTHON'
          import json
          report = json.load(open("vulnerabilities.json"))
          findings = [v for result in report.get("Results", [])
                      for v in result.get("Vulnerabilities", [])
                      if v.get("Severity") in ("HIGH", "CRITICAL") and v.get("FixedVersion")]
          for v in findings:
              print(f"{v['VulnerabilityID']}: {v['PkgName']} {v['InstalledVersion']} -> {v['FixedVersion']}")
          # Full unfiltered findings, including issues without vendor fixes,
          # remain in the uploaded report and SBOM for explicit triage.
          raise SystemExit(bool(findings))
          PYTHON
