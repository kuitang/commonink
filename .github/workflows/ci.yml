name: CI

on:
  push:
    branches:
      - master
      - prod
  pull_request:
    branches:
      - master
      - prod

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Use official signed Ubuntu archive with bounded downloads
        run: |
          # Azure's archive stalled during Chromium dependency provisioning.
          # Preserve Ubuntu signature verification and the original suite/keyring.
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          paths = [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in paths:
              if path.exists():
                  old = path.read_text()
                  new = old.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if old != new:
                      path.write_text(new)
                      print(f'Using official Ubuntu archive in {path}')
          PYTHON
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n' | sudo tee /etc/apt/apt.conf.d/80-commonink-download-timeout
      - name: Install SQLCipher OpenSSL development dependency
        run: timeout 360 sudo apt-get update && timeout 360 sudo apt-get install -y libssl-dev
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install matching Playwright npm driver and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/commonink-playwright" --ignore-scripts playwright-core@1.52.0
          mkdir -p "$RUNNER_TEMP/commonink-playwright-driver"
          ln -s "$RUNNER_TEMP/commonink-playwright/node_modules/playwright-core" "$RUNNER_TEMP/commonink-playwright-driver/package"
          echo "PLAYWRIGHT_DRIVER_PATH=$RUNNER_TEMP/commonink-playwright-driver" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_NODEJS_PATH=$(command -v node)" >> "$GITHUB_ENV"
          timeout 360 node "$RUNNER_TEMP/commonink-playwright-driver/package/cli.js" install-deps chromium
          timeout 360 node "$RUNNER_TEMP/commonink-playwright-driver/package/cli.js" install chromium
      - name: Run CI test suite (no external conformance)
        env:
          GO_TEST_PACKAGE_PARALLEL: "1"
        run: make ci

  deploy-preview:
    name: deploy-preview
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-preview-${{ github.event.number }}
      cancel-in-progress: true
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy preview
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
          SPRITE_TOKEN: ${{ secrets.SPRITE_TOKEN_STAGING }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          bash ./scripts/deploy-staging-preview.sh

  deploy-prod:
    name: deploy-prod
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy production
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
          APP_NAME: commonink
          CONFIG_FILE: fly.toml
        run: |
          bash ./scripts/deploy.sh
